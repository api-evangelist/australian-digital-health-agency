aid: australian-digital-health-agency
name: Australian Digital Health Agency
review:
  question: >-
    Does the Australian Digital Health Agency operate a real public developer surface,
    and what machine-readable API contracts (FHIR CapabilityStatement / OpenAPI) and
    auth model does it publish?
  answer: true
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: Australia
findings:
  summary: |
    The Australian Digital Health Agency (ADHA) is a national government health system
    and runs a real, layered developer surface. The primary developer portal is
    developer.digitalhealth.gov.au, which issues an HTTP 301 redirect to the Digital
    Health Implementer Hub at implementer.digitalhealth.gov.au (the canonical
    documentation/onboarding site). Both hosts sit behind bot protection that blocks
    automated (headless/curl) fetches with connection resets, so live 200 rendering
    could not be captured directly; the 301 from developer.digitalhealth.gov.au and
    the search-indexed live resource pages confirm the portal exists and is active.

    A REAL FHIR R4 CapabilityStatement WAS harvested from the ADHA-operated National
    Clinical Terminology Service (NCTS) FHIR terminology server at
    https://api.healthterminologies.gov.au/integration/R4/fhir/metadata (HTTP 200,
    fhirVersion 4.0.1, software Ontoserver 6.26.0). Its SMART-on-FHIR
    .well-known/smart-configuration was also harvested (HTTP 200). The NCTS
    (healthterminologies.gov.au) states it is "Part of digitalhealth.gov.au"; its
    Atom syndication feed is generated by "Australian Digital Health Agency",
    confirming ADHA operation.

    No downloadable OpenAPI/Swagger was found on the public surface; the My Health
    Record FHIR Gateway API specifications are published as versioned documents on the
    gated implementer hub (v2.3 and v3.0.0 referenced), not as a fetchable openapi.json.
    Production onboarding is gated: developer registration, a Mobile Developer Welcome
    Pack, conformance testing (test environment operated by Deloitte as Gateway
    Operator, healthAPIGatewaySVT@deloitte.com.au), and NASH PKI certificate issuance
    are required before connecting to national systems.
  developerPortal:
    url: https://developer.digitalhealth.gov.au/
    httpStatus: 301
    redirectsTo: https://implementer.digitalhealth.gov.au/
    note: >-
      Portal confirmed live via 301 redirect to the Implementer Hub. Both hosts block
      automated fetches (curl returns connection reset / 000; WebFetch times out) due
      to bot protection; live resource pages are search-indexed and real.
  fhirCapabilityStatement:
    captured: true
    source: https://api.healthterminologies.gov.au/integration/R4/fhir/metadata
    httpStatus: 200
    fhirVersion: 4.0.1
    software: Ontoserver 6.26.0 (CSIRO)
    savedTo: fhir/ncts-terminology-server-capabilitystatement.json
    resources:
    - CodeSystem
    - ConceptMap
    - OperationDefinition
    - StructureDefinition
    - ValueSet
    operations:
    - $expand
    - $lookup
    - $validate-code
    - $translate
    - $closure
  smartConfiguration:
    captured: true
    source: https://api.healthterminologies.gov.au/integration/R4/fhir/.well-known/smart-configuration
    httpStatus: 200
    savedTo: fhir/ncts-terminology-server-smart-configuration.json
    authorizationEndpoint: https://api.healthterminologies.gov.au/oauth2/login
    tokenEndpoint: https://api.healthterminologies.gov.au/oauth2/token
    scopesSupported:
    - openid
    - profile
  downloadableSpecs:
    openapiHarvested: false
    specsCount: 2
    provenance:
    - path: fhir/ncts-terminology-server-capabilitystatement.json
      source: https://api.healthterminologies.gov.au/integration/R4/fhir/metadata
      type: FHIR R4 CapabilityStatement
      httpStatus: 200
    - path: fhir/ncts-terminology-server-smart-configuration.json
      source: https://api.healthterminologies.gov.au/integration/R4/fhir/.well-known/smart-configuration
      type: SMART-on-FHIR configuration
      httpStatus: 200
    note: >-
      My Health Record FHIR Gateway API specifications (v2.3, v3.0.0) are published as
      versioned documents on the gated implementer hub, not as a fetchable OpenAPI.
  authModel:
    nationalRecordSystems:
      scheme: NASH SHA-2 PKI certificates over mutual TLS
      appliesTo:
      - My Health Record (B2B + Mobile FHIR Gateway)
      - Healthcare Identifiers (HI) Service
      - Electronic Prescribing
      - Secure Messaging
      note: >-
        A new NASH PKI Chain of Trust begins issuing updated certificates from
        August 2026.
    terminologyServer:
      scheme: SMART-on-FHIR OAuth2
      authorize: https://api.healthterminologies.gov.au/oauth2/login
      token: https://api.healthterminologies.gov.au/oauth2/token
      scopes:
      - openid
      - profile
  standardsConformance:
    fhir: R4 (4.0.1)
    implementationGuides:
    - AU Base (HL7 Australia)
    - AU Core (HL7 Australia / Sparked national FHIR accelerator)
    legacy:
    - HL7 CDA (clinical document exchange for My Health Record)
    usCore: false
    ukCore: false
    daVinci: false
    carin: false
    note: >-
      Australian national profiles (AU Base / AU Core), not US Core / UK Core.
  accessPosture: gated
  gatedReason: >-
    Registration, developer welcome pack, conformance testing, and NASH PKI issuance
    required before connecting to My Health Record, HI Service, or electronic
    prescribing. NCTS terminology server requires SMART-on-FHIR OAuth2 client
    registration.
transports:
- protocol: REST
  scheme: https
  baseURL: https://api.healthterminologies.gov.au/integration/R4/fhir
  documented: true
  note: FHIR R4 terminology service; live CapabilityStatement harvested.
- protocol: REST
  scheme: https
  baseURL: https://api.healthterminologies.gov.au/syndication/v1
  documented: true
  note: Atom Publishing Protocol syndication feed for terminology bundles (HTTP 200).
- protocol: FHIR/CDA over mTLS
  scheme: https
  documented: true
  note: >-
    My Health Record FHIR Gateway (B2B + Mobile) authenticated with NASH PKI over
    mutual TLS; specifications gated on the implementer hub.
- protocol: WebSocket
  scheme: wss
  documented: false
  note: No WebSocket surface documented.
