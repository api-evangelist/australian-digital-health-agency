note: >-
  The Australian Digital Health Agency publishes first-party sample/reference
  client libraries for its national systems through the AuDigitalHealth GitHub
  organisation (73 public repositories). These are official vendor libraries that
  assist conformant software connecting to My Health Record, the Healthcare
  Identifiers (HI) Service and the National Clinical Terminology Service (NCTS).
  They are distributed as source on GitHub; some are also published to package
  registries. Only repositories that are clearly Agency-authored client libraries
  are listed here as official.
