note: >-
  No official MCP server (hosted or local) was found for the Australian Digital Health Agency.
  The pre-flight MCP docs probe (2026-10-21) returned no-mcp-docs-found on implementer.digitalhealth.gov.au,
  developer.digitalhealth.gov.au, www.digitalhealth.gov.au, www.healthterminologies.gov.au and
  api.healthterminologies.gov.au, and a web search for an ADHA MCP server returned nothing.
  This is a CANDIDATE tool surface derived only from the interactions and operations advertised in the
  harvested NCTS FHIR Terminology Server CapabilityStatement. The standard FHIR terminology operations
  ($expand, $validate-code, $lookup, $translate) are NOT advertised in that harvested statement, so they
  are not listed here (the earlier candidate listed them; removed 2026-10-21). The ADHA SOAP services
  (HI Service, My Health Record B2B, Secure Message Delivery) are WSDL-only and NASH-PKI/mutual-TLS gated,
  so no tools are derived from them.
deployment:
