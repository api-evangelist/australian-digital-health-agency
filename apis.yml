apis:
- aid: australian-digital-health-agency:my-health-record-fhir-gateway
  name: My Health Record FHIR Gateway (B2B)
  description: >-
    The business-to-business FHIR Gateway for connecting conformant clinical software
    to the My Health Record national shared health record. Exposes FHIR-based read and
    upload interactions for clinical documents, mapping between HL7 CDA implementation
    guides and FHIR resources. Access is authenticated with NASH SHA-2 PKI certificates
    over mutual TLS and requires registration and conformance testing.
  humanURL: https://implementer.digitalhealth.gov.au/resources/services/my-health-record/my-health-record-fhir-gateway
  tags:
  - FHIR
  - My Health Record
  - EHR
  - Healthcare
  properties:
  - type: Documentation
    url: https://implementer.digitalhealth.gov.au/resources/services/my-health-record/my-health-record-fhir-gateway
  - type: APIReference
    url: https://implementer.digitalhealth.gov.au/resources/my-health-record-fhir-gateway-api-specification-v3-0-0
- aid: australian-digital-health-agency:my-health-record-fhir-mobile-gateway
  name: My Health Record FHIR Mobile Gateway
  description: >-
    The FHIR Mobile Gateway lets mobile and consumer applications connect to the My
    Health Record system to retrieve documents and health information on behalf of
    individuals. Registration and a developer welcome pack are required, and the
    interface is FHIR-based.
  humanURL: https://developer.digitalhealth.gov.au/developer-guide/introduction-my-health-record-fhir-gateway-developer-guide-1
  tags:
  - FHIR
  - My Health Record
  - Mobile
  - Healthcare
  properties:
  - type: Documentation
    url: https://developer.digitalhealth.gov.au/developer-guide/introduction-my-health-record-fhir-gateway-developer-guide-1
  - type: APIReference
    url: https://developer.digitalhealth.gov.au/resources/my-health-record-fhir-gateway-v4-0
- aid: australian-digital-health-agency:ncts-fhir-terminology-server
  name: NCTS FHIR Terminology Server
  description: >-
    The National Clinical Terminology Service (NCTS) FHIR terminology server, operated
    by ADHA on CSIRO Ontoserver. A FHIR R4 (4.0.1) terminology service supporting
    CodeSystem, ValueSet, ConceptMap, OperationDefinition and StructureDefinition
    resources with $expand, $lookup, $validate-code, $translate and $closure operations
    over SNOMED CT-AU, AMT and LOINC. Authenticated with SMART-on-FHIR OAuth2. A live
    FHIR CapabilityStatement was harvested from the /metadata endpoint.
  humanURL: https://www.healthterminologies.gov.au/implementing-in-software/terminology-as-a-service/ncts-apis/
  baseURL: https://api.healthterminologies.gov.au/integration/R4/fhir
  tags:
  - FHIR
  - Terminology
  - SNOMED CT
  - SMART on FHIR
  properties:
  - type: CapabilityStatement
    url: fhir/ncts-terminology-server-capabilitystatement.json
  - type: SmartConfiguration
    url: fhir/ncts-terminology-server-smart-configuration.json
  - type: Documentation
    url: https://www.healthterminologies.gov.au/implementing-in-software/terminology-as-a-service/ncts-apis/
  - type: APIReference
    url: https://api.healthterminologies.gov.au/integration/R4/fhir/metadata
- aid: australian-digital-health-agency:ncts-syndication-server
  name: NCTS National Syndication Server
  description: >-
    The NCTS National Syndication Server, an Atom Publishing Protocol profile for
    interrogating terminology content feeds and downloading FHIR terminology resource
    bundles (SNOMED CT-AU, AMT, LOINC, RCPA SPIA and more). The syndication feed is
    generated by the Australian Digital Health Agency and served as an Atom feed.
  humanURL: https://www.healthterminologies.gov.au/implementing-in-software/terminology-as-a-service/ncts-apis/
  baseURL: https://api.healthterminologies.gov.au/syndication/v1
  tags:
  - Terminology
  - Syndication
  - FHIR
  properties:
  - type: Documentation
    url: https://www.healthterminologies.gov.au/implementing-in-software/terminology-as-a-service/ncts-apis/
  - type: APIReference
    url: https://api.healthterminologies.gov.au/syndication/v1/syndication.xml
- aid: australian-digital-health-agency:electronic-prescribing
  name: Electronic Prescribing
  description: >-
    ADHA's electronic prescribing service and conformance profiles enabling electronic
    prescriptions, dispensing and the Active Script List across prescribing and
    dispensing software. Conformant integration uses NASH PKI certificates and the
    Healthcare Identifiers Service.
  humanURL: https://implementer.digitalhealth.gov.au/resources/services/electronic-prescribing
  tags:
  - e-Prescribing
  - Pharmacy
  - Healthcare
  properties:
  - type: Documentation
    url: https://implementer.digitalhealth.gov.au/resources/services/electronic-prescribing
- aid: australian-digital-health-agency:healthcare-identifiers-service
  name: Healthcare Identifiers (HI) Service
  description: >-
    The national Healthcare Identifiers Service, providing unique identifiers for
    individuals (IHI), healthcare providers (HPI-I) and organisations (HPI-O) that
    underpin My Health Record, electronic prescribing and secure messaging. Access is
    authenticated with NASH PKI certificates.
  humanURL: https://implementer.digitalhealth.gov.au/resources/services/healthcare-identifiers-service-hi
  tags:
  - Identifiers
  - Healthcare
  - Directory
  properties:
  - type: Documentation
    url: https://implementer.digitalhealth.gov.au/resources/services/healthcare-identifiers-service-hi
