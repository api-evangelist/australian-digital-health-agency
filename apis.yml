- aid: australian-digital-health-agency:my-health-record-b2b-gateway-soap
  name: My Health Record B2B Gateway (SOAP)
  description: >-
    The SOAP/XML business-to-business interface to the My Health Record system,
    covering record access (DoesPCEHRExist, GainPCEHRAccess), IHE XDS.b document
    upload, retrieval and removal, view services (audit, change history, individual
    details, representative list, consolidated views) and template services. The
    WSDLs are published verbatim from the agency's AuDigitalHealth/mhr-b2b-client-dotnet
    repository; their soap:address values are placeholders, and production endpoints
    are issued during registration and conformance testing. Calls are signed and
    authenticated with NASH PKI certificates over TLS.
  humanURL: https://github.com/AuDigitalHealth/mhr-b2b-client-dotnet
