name: Australian Digital Health Agency

kind: company

description: >-
  The Australian Digital Health Agency (ADHA) is the Australian Government statutory
  agency responsible for national digital health infrastructure and standards. It
  operates and stewards My Health Record (the national shared health record), the
  Healthcare Identifiers (HI) Service, the National Authentication Service for Health
  (NASH) PKI, electronic prescribing, and the National Clinical Terminology Service
  (NCTS). ADHA publishes machine-readable APIs for connecting conformant clinical
  software to these national systems, centred on HL7 FHIR (R4) alongside legacy HL7
  CDA document exchange. Its developer surface spans the My Health Record FHIR Gateway
  (B2B and Mobile), the NCTS FHIR terminology server and Atom syndication feed
  (SNOMED CT-AU, AMT, LOINC), and conformance profiles for electronic prescribing.
  Home market is Australia. Authentication to the national record systems uses NASH
  SHA-2 PKI certificates (mutual TLS), while the NCTS terminology server uses
  SMART-on-FHIR OAuth2. Production onboarding is gated behind registration, conformance
  testing, and PKI issuance; ADHA aligns to the AU Base / AU Core FHIR implementation
  guides stewarded through HL7 Australia and the Sparked national FHIR accelerator.

