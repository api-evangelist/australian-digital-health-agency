- aid: australian-digital-health-agency:secure-message-delivery
  name: Secure Message Delivery (SMD) and Endpoint Location Service (ELS)
  description: >-
    The national secure messaging specifications for exchanging sealed clinical
    messages between healthcare organisations: Sealed Message Delivery, Sealed
    Immediate Message Delivery, Sealed Message Retrieval, Transport Response Delivery
    and Retrieval, plus the Endpoint Location Service (lookup and publish of service
    interactions). The WSDLs are published by the agency in its AuDigitalHealth GitHub
    organisation (smd-*-wsdl-tls-java and els-b2b-client-dotnet); their soap:address
    values are placeholders, since these services are implemented by secure messaging
    providers rather than a single agency-hosted endpoint.
  humanURL: https://github.com/AuDigitalHealth/smd-b2b-client-dotnet
