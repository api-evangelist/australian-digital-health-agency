- aid: australian-digital-health-agency:my-health-record-fhir-mobile-gateway
  name: My Health Record FHIR Mobile Gateway
  description: >-
    The FHIR Mobile Gateway lets mobile and consumer applications connect to the My
    Health Record system to retrieve documents and health information on behalf of
    individuals. Registration and a developer welcome pack are required, and the
    interface is FHIR-based.
  humanURL: https://implementer.digitalhealth.gov.au/developer-guide/introduction-my-health-record-fhir-gateway-developer-guide-1
